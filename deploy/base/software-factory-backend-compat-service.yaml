# Compatibiliteitsalias op de oude servicenaam. Product Factory pint in productie het interne adres
# http://softwarefactory-dashboard-backend.software-factory.svc.cluster.local/api/integrations/v2;
# zolang die configuratie niet is omgezet naar software-factory-backend blijft deze alias staan.
apiVersion: v1
kind: Service
metadata:
  name: softwarefactory-dashboard-backend
  labels:
    app: software-factory-backend
spec:
  selector:
    app: software-factory-backend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
