name: Build software factory backend image

on:
  workflow_run:
    workflows: [Repository verification]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: software-factory-backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robbertvdzon/software-factory-backend

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Short SHA
        id: sha
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Versie-info voor het dashboard: in het image is geen .git, zie FactoryVersionService.
      - name: Build info
        id: build
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%ci)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: softwarefactory/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.IMAGE }}:main
          build-args: |
            SF_BUILD_COMMIT=${{ steps.build.outputs.commit }}
            SF_BUILD_BRANCH=main
            SF_BUILD_COMMIT_SUBJECT=${{ steps.build.outputs.subject }}
            SF_BUILD_COMMIT_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=software-factory-backend
          cache-to: type=gha,mode=max,scope=software-factory-backend

  bump-manifests:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tag in deploy/base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/bump-images.sh \
            software-factory-backend \
            "${{ github.event.workflow_run.id || github.run_id }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            deploy/base \
            "ci: bump software-factory-backend to ${{ needs.build.outputs.tag }}" \
            "ghcr.io/robbertvdzon/software-factory-backend=ghcr.io/robbertvdzon/software-factory-backend:${{ needs.build.outputs.tag }}"
