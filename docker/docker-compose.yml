name: software-factory

# Lokale keten: Postgres, de volledige Software Factory als container en het dashboard.
# Voor ontwikkelen draai je de factory meestal op de host (`./factory start`) en gebruik je
# alleen `postgres` (`./factory local-db`); de frontend praat dan via `flutter run` met :8080.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: software_factory
      POSTGRES_USER: software_factory
      POSTGRES_PASSWORD: software_factory
    ports:
      - "${SF_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - software-factory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U software_factory -d software_factory"]
      interval: 5s
      timeout: 5s
      retries: 12

  software-factory-backend:
    build:
      context: ..
      dockerfile: softwarefactory/Dockerfile
      args:
        SF_BUILD_COMMIT: ${SF_DASHBOARD_BUILD_SHA:-local}
        SF_BUILD_BRANCH: local
    restart: unless-stopped
    # Alle SF_*-sleutels uit secrets.env (of een alternatief bestand via SF_COMPOSE_SECRETS) komen als
    # omgevingsvariabelen binnen; hieronder de waarden die in Compose altijd anders zijn.
    env_file:
      - ${SF_COMPOSE_SECRETS:-../secrets.env}
    environment:
      SERVER_PORT: "80"
      SF_DATABASE_URL: postgresql://software_factory:software_factory@postgres:5432/software_factory
      SF_TRACKER_ATTACHMENTS_DIR: /app/attachments
      # Nooit twee Telegram-pollers op één bot-token (de factory op de host loopt meestal al).
      SF_TELEGRAM_BOT_TOKEN: ""
      SF_TELEGRAM_CHAT_ID: ""
    volumes:
      - software-factory-attachments:/app/attachments
    ports:
      - "127.0.0.1:${SF_LOCAL_DASHBOARD_BACKEND_PORT:-9090}:80"
    depends_on:
      postgres:
        condition: service_healthy

  software-factory-frontend:
    build:
      context: ../dashboard-frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ""
        BUILD_SHA: ${SF_DASHBOARD_BUILD_SHA:-local}
        BUILD_TIMESTAMP: ${SF_DASHBOARD_BUILD_TIMESTAMP:-local}
        GOOGLE_CLIENT_ID: ${SF_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SF_LOCAL_DASHBOARD_FRONTEND_PORT:-9080}:8080"
    depends_on:
      - software-factory-backend

volumes:
  software-factory-postgres-data:
  software-factory-attachments:
