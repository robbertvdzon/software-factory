apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: software-factory
resources:
- sealed-secret.yaml
- database.yaml
- attachments-pvc.yaml
- software-factory-backend-deployment.yaml
- software-factory-backend-service.yaml
- software-factory-frontend-deployment.yaml
- software-factory-frontend-service.yaml
- software-factory-route.yaml
- sealed-secret-ai-access.yaml
- sealed-central-postgres.yaml
images:
- name: ghcr.io/robbertvdzon/software-factory-backend
  newName: ghcr.io/robbertvdzon/software-factory-backend
  newTag: sha-1ead0a4
- name: ghcr.io/robbertvdzon/software-factory-frontend
  newName: ghcr.io/robbertvdzon/software-factory-frontend
  newTag: sha-1ead0a4
patches:
- path: agent-access-patch.yaml
- path: backend-memory.yaml
- path: software-factory-frontend-memory.yaml
- path: central-postgres-patch.yaml
- path: sf_prod-retired-database.yaml
