version: 1
commands:
  - id: repository-maven-verify
    # Alle JVM-modules uit pom.xml <modules> + de root-buildfiles zelf. Een wijziging puur onder
    # dashboard-frontend/ of docs/ raakt geen van deze paden en slaat dit (trage) commando dus
    # over. Bij twijfel/onbekende diff (geen
    # baseBranch, git-fout) draait dit gewoon altijd; alleen een aantoonbaar niet-overlappende
    # diff mag skippen.
    pathPrefixes:
      - factory-contracts/
      - factory-common/
      - softwarefactory/
      - dashboard-backend/
      - pom.xml
      - .factory/verification.yaml
    argv:
      - mvn
      - -B
      - --no-transfer-progress
      # `clean` voorkomt dat oude build-output de verificatie beïnvloedt.
      - clean
      - verify
    workingDirectory: .
    timeoutSeconds: 1800
  - id: dashboard-flutter-verify
    pathPrefixes:
      - dashboard-frontend/
      - tools/verify-dashboard-frontend
    argv:
      - tools/verify-dashboard-frontend
    workingDirectory: .
    timeoutSeconds: 1800
  - id: repository-documentation-audit
    argv:
      - tools/audit-documentation
    workingDirectory: .
    timeoutSeconds: 120
