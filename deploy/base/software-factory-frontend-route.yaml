apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: software-factory-frontend
  labels:
    app: software-factory-frontend
spec:
  host: dashboard.vdzonsoftware.nl
  to:
    kind: Service
    name: software-factory-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    # Cloudflare terminates public HTTPS and reaches this Route over HTTP. Redirect would
    # therefore send the client back to the same public HTTPS URL and break /bridge.
    insecureEdgeTerminationPolicy: Allow
